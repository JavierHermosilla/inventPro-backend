services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventpro-backend:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_SCHEMA: inventpro_user
    ports:
      - "3000:3000"
