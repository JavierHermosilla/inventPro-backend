components:
  parameters:
    UUIDId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    ExportMode:
      in: query
      name: mode
      required: false
      schema:
        type: string
        enum: [merged, zip]
        default: merged
      description: |
        merged = CSV plano en un archivo.
        zip    = ZIP con múltiples CSV (productos, proveedores, clientes, órdenes, items).
    ExportSep:
      in: query
      name: sep
      required: false
      schema:
        type: string
        default: ","
      description: Separador de columnas del CSV (ej. "," o ";").
  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        details:
          type: array
          items: { type: string }
    Pagination:
      type: object
      properties:
        total: { type: integer, example: 42 }
        page:  { type: integer, example: 1 }
        pages: { type: integer, example: 5 }